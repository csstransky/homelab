# MOTHERLODE snapshot policy (Checkpoint 3, 2026-10-04). Repo copy: zfs/sanoid.conf
# sanoid.timer runs every 15 min; each value is how many snapshots of that kind to KEEP.
# Snapshot names are in UTC (sanoid.service sets TZ=UTC). Not listed = not snapshotted
# (the media pool and tank500gb's own root are deliberately absent).

############ source: tank1tb ############

[tank1tb/Documents]
	use_template = important
[tank1tb/Pictures]
	use_template = important
[tank1tb/Nextcloud]
	use_template = important
[tank1tb/Apps]
	use_template = important
[tank1tb/Music]
	use_template = music
[tank1tb/Backups]
	use_template = backups

############ replica: tank500gb (filled nightly by syncoid, never snapshotted locally) ############

[tank500gb/Documents]
	use_template = replica_important
[tank500gb/Pictures]
	use_template = replica_important
[tank500gb/Nextcloud]
	use_template = replica_important
[tank500gb/Apps]
	use_template = replica_important
[tank500gb/Music]
	use_template = replica_music
[tank500gb/Backups]
	use_template = replica_backups

############ templates ############

[template_important]
	hourly = 24
	daily = 30
	weekly = 8
	monthly = 12
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_music]
	hourly = 0
	daily = 30
	weekly = 4
	monthly = 6
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_backups]
	hourly = 0
	daily = 14
	weekly = 4
	monthly = 3
	yearly = 0
	autosnap = yes
	autoprune = yes

# Replicas keep the same history as their source but only prune; snapshots arrive via syncoid.
# (sanoid templates cannot inherit from each other, so the numbers are repeated.)
[template_replica_important]
	hourly = 24
	daily = 30
	weekly = 8
	monthly = 12
	yearly = 0
	autosnap = no
	autoprune = yes
	hourly_warn = 2880m
	hourly_crit = 3600m
	daily_warn = 48h
	daily_crit = 60h

[template_replica_music]
	hourly = 0
	daily = 30
	weekly = 4
	monthly = 6
	yearly = 0
	autosnap = no
	autoprune = yes
	daily_warn = 48h
	daily_crit = 60h

[template_replica_backups]
	hourly = 0
	daily = 14
	weekly = 4
	monthly = 3

	autosnap = no
	autoprune = yes
	daily_warn = 48h
	daily_crit = 60h
