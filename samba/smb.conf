# MOTHERLODE Samba configuration (Checkpoint 4, 2026-10-04).
# Recreated from the 2026-09-27 Rebuild Report, section 26. Repo copy: samba/smb.conf
# /tank1tb/Nextcloud is deliberately NOT shared.

[global]
    workgroup = WORKGROUP
    server string = MOTHERLODE
    server role = standalone server
    security = user
    map to guest = Never
    min protocol = SMB2
    server min protocol = SMB2
    obey pam restrictions = yes
    unix password sync = yes
    pam password change = yes
    log file = /var/log/samba/log.%m
    max log size = 1000
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[Documents]
    path = /tank1tb/Documents
    browseable = yes
    read only = no
    guest ok = no
    valid users = ghost
    force group = nas
    create mask = 0664
    directory mask = 2775

[Photos]
    path = /tank1tb/Photos
    browseable = yes
    read only = no
    guest ok = no
    valid users = ghost
    force group = nas
    create mask = 0664
    directory mask = 2775

[Music]
    path = /tank1tb/Music
    browseable = yes
    read only = no
    guest ok = no
    valid users = ghost
    force group = nas
    create mask = 0664
    directory mask = 2775

[Media]
    path = /media
    browseable = yes
    read only = no
    guest ok = no
    valid users = ghost
    force group = nas
    create mask = 0664
    directory mask = 2775

[Other]
    path = /other
    browseable = yes
    read only = no
    guest ok = no
    valid users = ghost
    force group = nas
    create mask = 0664
    directory mask = 2775
